<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마음한톨 | 맞춤 루틴 (팀원 4 · 차명진)</title>

<link rel="stylesheet" href="routine.css">  <!-- [CSS 연결] 모양(색, 크기, 배치) style.css  -->
<script src="main.js" defer></script>       <!-- [JS 연결] 동작(버튼)은 main.js -->

<body>

  <!-- ===== [팀원 4 · 차명진] 맞춤 루틴(Routine) — ✅ 내 담당 ===== -->
  <section class="section" id="routines">
    <div class="container">
      <div class="section-heading">
        <p class="section-label">SMALL ROUTINE</p>
        <h2>내 고민에 맞는 작은 루틴</h2>
        <p>고민별 루틴을 미리 살펴봐요. 실제 추천은 문답을 끝낸 뒤에 받을 수 있어요.</p>
      </div>
      <div class="routine-preview">
        <div class="category">
          <button class="active" data-plan="money">💰 돈과 생활</button>
          <button data-plan="job">💼 취업과 진로</button>
          <button data-plan="love">💕 인간관계</button>
          <button data-plan="future">🌧️ 미래 걱정</button>
          <button data-plan="rest">☕ 피로와 휴식</button>
        </div>
        <div class="routine-card">
          <p class="small">🌱 톨이의 추천 루틴 미리보기</p>
          <h3 id="planTitle">티끌 모아 태산</h3>
          <p class="description" id="planDescription">돈 때문에 힘들다면 작은 소비 기록부터 시작해보자.</p>
          <div id="planTasks">
            <div class="task"><span>📝 오늘 쓴 돈 한 가지 기록하기</span><b>매일</b></div>
            <div class="task"><span>📒 이번 주 지출 돌아보기</span><b>매주</b></div>
            <div class="task"><span>💰 한 달에 1만 원 모으기</span><b>매월</b></div>
          </div>
          <a href="self.html" class="btn btn-primary">나만의 루틴 추천받기 🌱</a>
        </div>
      </div>
    </div>
  </section>
  <!-- ===== 내 담당 끝 ===== -->

</body>
</html>
